<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 ログイン</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <header class="bar"><h1>ログイン</h1><a class="icon-btn" href="index.html" aria-label="モック一覧へ">☰</a></header>
  <main>
    <p>食事の準備が、少し楽しみになるように。おいしそうな出会いをためておきましょう。</p>
    <form>
      <p><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email"></p>
      <p><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password"></p>
      <p class="error" role="alert">メールアドレスまたはパスワードが違います（表示例）</p>
      <p><a class="btn primary block" href="s3-before-shopping.html">ログイン</a></p>
      <p><a href="#">パスワードを忘れた方</a></p>
    </form>
    <hr>
    <p>はじめての方は <a class="btn" href="s2-group.html">新規登録</a></p>
    <p class="hint">ログインが続けて失敗したときは、「15 分お待ちください」と表示します。</p>
  </main>
</div>
</body>
</html>

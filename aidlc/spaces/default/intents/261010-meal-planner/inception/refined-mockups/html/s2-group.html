<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2 グループの作成・参加</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <header class="bar"><h1>家族のグループ</h1><a class="icon-btn" href="index.html" aria-label="モック一覧へ">☰</a></header>
  <main>
    <section class="card">
      <h2>グループを作る</h2>
      <p class="meta">作ると、無難な料理 30 件が最初から入ります。</p>
      <a class="btn primary block" href="s3-before-shopping.html">グループを作る</a>
    </section>
    <section class="card">
      <h2>招待リンクで参加する</h2>
      <p><label for="link">招待リンク</label><input id="link" type="url" placeholder="リンクを貼り付け"></p>
      <p class="error" role="alert">このリンクは期限が切れています。招待した人に、新しいリンクをお願いしてください。（表示例）</p>
      <a class="btn block" href="s3-before-shopping.html">参加する</a>
    </section>
    <section class="card">
      <h2>作成後に表示される招待リンク（7 日間有効）</h2>
      <p class="hint">https://example.invalid/invite/abc123（ダミー）</p>
      <button class="btn">コピー</button>
    </section>
  </main>
</div>
</body>
</html>

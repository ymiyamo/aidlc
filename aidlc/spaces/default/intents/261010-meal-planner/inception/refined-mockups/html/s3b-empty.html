<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>S3 買い物前（保存が 0 件）</title>

<body>
<div class="phone">

  <a class="fab" href="s4-save.html" aria-label="保存する">＋</a>
  <nav class="tabs" aria-label="主な画面">

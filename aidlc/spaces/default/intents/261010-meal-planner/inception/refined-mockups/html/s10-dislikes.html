<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S10 好き嫌いの登録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <header class="bar"><a class="icon-btn" href="s3-before-shopping.html" aria-label="戻る">←</a><h1>好き嫌い</h1><a class="icon-btn" href="s11-group-account.html" aria-label="グループとアカウント">⋮</a></header>
  <main>
    <section class="card">
      <h2>嫌いな食材</h2>
      <div class="row" style="margin-bottom:12px">
        <span class="chip" style="display:inline-flex;align-items:center">えび <button class="icon-btn" aria-label="えびを外す" style="min-width:44px">×</button></span>
        <span class="chip" style="display:inline-flex;align-items:center">きのこ <button class="icon-btn" aria-label="きのこを外す">×</button></span>
      </div>
      <p><label for="dislike">食材を追加</label><input id="dislike" type="text" placeholder="例：ピーマン"></p>
      <button class="btn primary">追加</button>
    </section>
    <p class="hint">同じ言葉でそろえて入力してください。「えび」と「海老」は別の食材として扱います。</p>
  </main>
</div>
</body>
</html>

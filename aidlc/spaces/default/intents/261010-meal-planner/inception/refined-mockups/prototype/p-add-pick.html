<!DOCTYPE html>
<html lang="ja">
<head>

<title>作ったものを選ぶ</title>

<body>
<div class="phone">
  <header class="bar"><a class="icon-btn" href="p-day.html" aria-label="戻る">←</a><h1>作ったものを選ぶ</h1><span style="width:44px"></span></header>
  <main>
    <p class="hint">10 月 8 日（木）に作ったもの</p>
    <p><label for="q">料理名で探す</label><input id="q" type="text" placeholder="例：鮭"></p>
    <div class="seg" role="group" aria-label="絞り込み"><a class="btn" href="p-add-pick.html" aria-current="true">最近選んだもの</a><a class="btn" href="p-add-pick.html">お気に入り</a></div>
    <ul class="list">
      <li><div class="thumb small">🐟</div><a href="p-add-entry.html" style="flex:1;color:inherit;text-decoration:none"><strong>鮭のホイル焼き</strong><br><span class="meta">15分・楽（作った回数：3 回）</span></a></li>
      <li><div class="thumb small rose">🍅</div><a href="p-add-entry.html" style="flex:1;color:inherit;text-decoration:none"><strong>鶏肉のトマト煮</strong><br><span class="meta">30分・ふつう（作った回数：1 回）</span></a></li>
      <li><div class="thumb small green">🥬</div><a href="p-add-entry.html" style="flex:1;color:inherit;text-decoration:none"><strong>豆腐の和風ステーキ</strong> <span class="sample-note">サンプルの料理</span><br><span class="meta">15分・楽（まだ作っていない）</span></a></li>
    </ul>
    <p><a class="btn block" href="p-save.html">見つからない → 保存する画面へ</a></p>
    <p><a href="p-add-duplicate.html">（試す）同じ日に同じ料理を追加した場合</a></p>
